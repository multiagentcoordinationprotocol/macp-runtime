[package]
name = "macp-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MACP reference runtime: a coordination kernel and gRPC server enforcing session boundaries, message validation, append-only history, modes, and governance policy."
readme = "README.md"
default-run = "macp-runtime"
# Keep operational and development-only directories out of the published crate.
exclude = ["/temp", "/.macp-data", "/plans", "/scripts", "/.githooks"]

[workspace]
members = ["crates/*"]
# integration_tests is a separate crate with its own target dir, run manually
# through the real gRPC boundary; it is not part of the main Cargo build.
exclude = ["integration_tests"]

# Shared package metadata inherited by every workspace crate via
# `<field>.workspace = true`, so version and release metadata live in one place.
[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.89.0"
license = "Apache-2.0"
repository = "https://github.com/multiagentcoordinationprotocol/macp-runtime"
authors = ["Ajit Koti <ajitkoti@zer07labs.com>"]

# Shared dependency versions for every crate in the workspace. Member crates
# reference these via `{ workspace = true }` so versions stay pinned in one place.
# Internal crates carry both `version` (used when published to crates.io) and
# `path` (used for local workspace builds).
[workspace.dependencies]
# Internal crates
macp-pb = { version = "0.11.0", path = "crates/macp-pb" }
macp-core = { version = "0.11.0", path = "crates/macp-core" }
macp-policy = { version = "0.11.0", path = "crates/macp-policy" }
macp-storage = { version = "0.11.0", path = "crates/macp-storage" }
macp-auth = { version = "0.11.0", path = "crates/macp-auth" }
macp-modes = { version = "0.11.0", path = "crates/macp-modes" }
macp-conform = { version = "0.11.0", path = "crates/macp-conform" }
macp-runtime = { version = "0.11.0", path = "." }
# External
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
thiserror = "2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"
futures-core = "0.3"
async-stream = "0.3"
async-trait = "0.1"
jsonwebtoken = "9"
reqwest = { version = "0.13", features = ["json"], default-features = false }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rocksdb = { version = "0.25" }
redis = { version = "1.2", features = ["tokio-comp", "aio"] }
macp-proto = "0.1.13"
tonic-prost-build = "0.14"
tempfile = "3"
base64 = "0.23"
ed25519-dalek = { version = "3", default-features = false }
sha2 = "0.11"

[features]
default = []
rocksdb-backend = ["macp-storage/rocksdb-backend"]
redis-backend = ["macp-storage/redis-backend"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tower-http",
    "dep:http",
    "dep:tower",
]
# gRPC server reflection for dev/debug tooling (e.g. grpcurl, grpcui). Never
# enabled in the published Docker image or a default `cargo build` -- see
# docs/deployment.md's "gRPC reflection" note under Monitoring.
reflection = ["dep:tonic-reflection"]
# The HTTP/JSON binding (RFC-MACP-0006 §4) and its canonical JSON codec
# (RFC-MACP-0001 §10), compiled into `src/http/`. Off by default; at runtime
# the listener starts only when `MACP_HTTP_BIND_ADDR` is set. The hyper/rustls
# dependencies are used by the listener itself and are declared here once.
http-listener = [
    "dep:prost-reflect",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:tokio-rustls",
    "dep:http",
    "dep:bytes",
]

[dependencies]
macp-pb = { workspace = true }
macp-core = { workspace = true, features = ["receipts"] }
macp-storage = { workspace = true }
macp-policy = { workspace = true }
macp-modes = { workspace = true }
macp-auth = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic-prost = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-stream = { workspace = true }
futures-core = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
# 0.32 defaults switched to HTTP transport (http-proto + reqwest-blocking-client)
# plus metrics/logs; disable them and select the gRPC/tonic trace path explicitly.
# `metrics` feeds the semconv instruments; `tls-ring` + `tls-roots` let an
# `https://` endpoint verify against the platform's native roots. `tls-roots`
# only compiles that support in: `src/telemetry/init.rs` still has to ask for
# the roots with `ClientTlsConfig::with_enabled_roots()`.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
    "metrics",
    "tls-ring",
    "tls-roots",
], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
# The gRPC SERVER span layer (`otel` only). The root crate has no other direct
# `tower` dependency; `util` provides `option_layer`.
tower-http = { version = "0.6", features = ["trace"], optional = true }
http = { version = "1", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tonic-reflection = { version = "0.14", optional = true }
# `http-listener` only. prost-reflect supplies descriptors, `DynamicMessage`
# and generic wire decoding; the JSON mapping itself is in-house
# (`src/http/json/`), so its `serde` feature stays off. The 0.16 line depends
# on prost 0.14, the workspace prost -- `cargo tree -d` shows one prost.
prost-reflect = { version = "0.16", default-features = false, optional = true }
# Versions match what tonic already pulls into Cargo.lock.
hyper = { version = "1.8", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1.20", features = ["server", "server-graceful", "service", "tokio", "http1", "http2"], optional = true }
http-body-util = { version = "0.1.3", optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
bytes = { version = "1.11", optional = true }
macp-proto = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The conformance runner library: tests/conformance_loader.rs drives every
# fixture through it, against this runtime and against its in-process target;
# tests/conformance_http.rs (and the `http-listener` unit test that breaks the
# Ack mapping on purpose) drive it over both bindings, hence `grpc` + `http`.
# Dev-only: the runner's HTTP client (hyper's client side) stays out of this
# crate's normal dependency edges.
macp-conform = { workspace = true, features = ["grpc", "http"] }
criterion = "0.8"
# `otel` tests: the in-memory span exporter (`testing`), the OTLP trace and
# metrics collector service stubs for the fake collector in `tests/support/fake_collector.rs`,
# and a throwaway CA for the OTLP TLS test.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
tracing-opentelemetry = "0.33"
opentelemetry-proto = { version = "0.32", default-features = false, features = [
    "gen-tonic",
    "trace",
    "metrics",
] }
rcgen = "0.13"
# `http-listener` tests drive the listener with hyper's client connections
# (in-process over a duplex pipe, and against the real binary).
hyper = { version = "1.8", features = ["client", "http1", "http2"] }

[[bench]]
name = "replay_bench"
harness = false

[build-dependencies]
tonic-prost-build = { workspace = true }
macp-proto = { workspace = true }
