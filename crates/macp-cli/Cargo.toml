[package]
name = "macp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The `macp` command line: run the self-host stack, verify decision receipts, run conformance, tail sessions and replay them."
readme = "README.md"
keywords = ["macp", "cli", "multi-agent", "protocol", "receipt"]
categories = ["command-line-utilities"]
include = ["src/**", "deploy/**", "Cargo.toml", "README.md"]

[[bin]]
name = "macp"
path = "src/main.rs"

[dependencies]
macp-core = { workspace = true }
macp-pb = { workspace = true }
macp-conform = { workspace = true, features = ["grpc"] }
macp-runtime = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "3"
