[package]
name = "macp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MACP coordination vocabulary: error, session model, decision domain types, and the policy evaluation trait. Transport-free."
readme = "README.md"

[dependencies]
macp-pb = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true, features = ["fast", "zeroize", "pem"] }

[features]
default = []
# Decision receipts (RFC-MACP-0013 §13): `macp_core::receipt`. Off by
# default so the embeddable vocabulary carries no signature crates.
receipts = ["dep:base64", "dep:ed25519-dalek"]

[[test]]
name = "receipt_vectors"
required-features = ["receipts"]

[package.metadata.docs.rs]
features = ["receipts"]
