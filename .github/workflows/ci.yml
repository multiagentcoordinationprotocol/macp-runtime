name: MACP Runtime CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs on the same PR/branch; never cancel main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins the workspace toolchain; keep this in sync with
  # it (it is passed to the toolchain action so jobs get rustfmt/clippy
  # components instead of rustup's minimal auto-install of the file pin).
  RUST_TOOLCHAIN: "1.96.1"
  # Minimum supported Rust version, gated by the `check` job. Must match
  # `rust-version` in the root Cargo.toml.
  MSRV_TOOLCHAIN: "1.89.0"
  PROTOC_VERSION: "31.x"
  # The spec-repo commit the `conformance-oracle` job reads its canonical
  # fixtures and policy schemas from. PINNED ON PURPOSE -- this job gates merges,
  # and before the pin it checked out the spec's default branch at run time, so a
  # green PR could turn red because another repository merged something. That is
  # not hypothetical: on 2026-09-11 three separate upstream merges reddened this
  # repo's CI with no change on our side, and the third blocked a release PR.
  #
  # Bumping this is a deliberate act and belongs in the SAME PR as the alignment
  # work it requires (vendor changed fixtures byte-identically, re-check the
  # hand-written schema mirrors in crates/macp-policy/src/registry.rs, implement
  # any new normative behaviour). Bumping it alone reddens every PR.
  #
  # The `spec-drift` workflow parses this exact value -- it is the single source
  # of truth -- and files one tracked issue when upstream moves ahead of it in a
  # way that touches the mirrored trees. Pin without that watcher and the gate
  # quietly rots; that pairing is the whole design.
  SPEC_REV: "99f3cfa090b4bfb72b3063ca0134ec661436c3ef"

jobs:
  actionlint:
    name: Lint workflows (advisory)
    runs-on: ubuntu-latest
    # Advisory: workflow lint findings surface as annotations without
    # blocking unrelated changes.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  check:
    name: Check (MSRV)
    runs-on: ubuntu-latest
    env:
      # Job-level override: the MSRV gate must run on 1.89.0, not the
      # rust-toolchain.toml pin. (Hardcoded because workflow env isn't
      # referencable in job-level env; keep in sync with MSRV_TOOLCHAIN.)
      RUSTUP_TOOLCHAIN: "1.89.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.MSRV_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      # Guards the shape in issue #140: a Cargo.lock that pins a version its
      # Cargo.toml forbids. No other PR-level job passes --locked, so such a
      # lockfile stayed green here and only failed later at `cargo publish
      # --locked` in publish.yml -- i.e. at release time, not on the PR that
      # introduced it. `cargo metadata --locked` resolves without building and
      # fails if the lockfile is not exactly what the manifests imply.
      #
      # This step covers the ROOT workspace only. `integration_tests/` is a
      # SEPARATE workspace with its own lock, and it IS guarded too -- but by
      # the `integration` job, not here. Two reasons it lives there: this job
      # is the MSRV gate and pins RUSTUP_TOOLCHAIN to 1.89.0, while
      # `integration_tests/Cargo.toml` declares no `rust-version`, so a
      # dependency raising its MSRV past 1.89 would red the MSRV job for a
      # reason unrelated to lockfile consistency; and `integration` runs the
      # current toolchain, already caches that workspace, and is the job that
      # actually consumes the lock.
      #
      # That guard used to be impossible: release-plz bumps the seven crates'
      # versions and regenerates the root lock but never the integration one,
      # leaving it stale by construction after every version bump. The
      # `sync-integration-lock` job in release-plz.yml now regenerates it on
      # the release PR, so it is no longer stale-by-construction and the guard
      # is safe to enforce on every PR.
      - name: Verify Cargo.lock is consistent with the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Cargo check
        run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: main

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # macp-conform's gRPC target and CLI sit behind its `grpc` feature,
      # which the workspace run above does not enable.
      - name: Run clippy (macp-conform, grpc feature)
        run: cargo clippy -p macp-conform --features grpc --all-targets -- -D warnings

      # ...nor its HTTP target (`http`, plans/http-listener.md P10), alone and
      # with the CLI that selects it (`--transport http`).
      - name: Run clippy (macp-conform, http feature)
        run: |
          cargo clippy -p macp-conform --features http --all-targets -- -D warnings
          cargo clippy -p macp-conform --features grpc,http --all-targets -- -D warnings

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: main

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      - name: Build docs (deny warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Every MACP_HTTP_* variable is documented
        # The names are read from src/http/config.rs, the only reader.
        # CLAUDE.md is gitignored (local-only), so only the operator doc is
        # checked here.
        run: |
          vars=$(grep -ohE 'MACP_HTTP_[A-Z_]+' src/http/config.rs | sort -u)
          test -n "$vars" || { echo "::error::no MACP_HTTP_* variable found in src/http/config.rs"; exit 1; }
          missing=0
          for v in $vars; do
            if ! grep -qF "\`$v\`" docs/deployment.md; then
              echo "::error file=docs/deployment.md::$v (src/http/config.rs) is not documented in docs/deployment.md"; missing=1
            fi
          done
          exit "$missing"

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: main

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      - name: Run tests
        run: cargo test --workspace --all-targets
        env:
          MACP_MEMORY_ONLY: "1"

      - name: Run conformance tests
        run: cargo test --workspace conformance
        env:
          MACP_MEMORY_ONLY: "1"

      - name: Run policy tests
        run: cargo test --workspace policy
        env:
          MACP_MEMORY_ONLY: "1"

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      - name: Build release
        run: cargo build --release

  deps-isolation:
    name: Crate Dependency Isolation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      # Enforce the workspace's layering invariants: the transport-free
      # vocabulary and logic crates must not pull in transport, storage, auth,
      # or any concrete policy engine. A regression here defeats the split.
      - name: macp-core is transport/runtime-free
        run: |
          deps=$(cargo tree -p macp-core --edges normal)
          echo "$deps"
          # Strip the parenthesized manifest path before grepping so the check
          # matches crate names only — the checkout directory itself is named
          # "macp-runtime" and would otherwise trip the forbidden pattern.
          if echo "$deps" | sed 's/ ([^)]*)//' | grep -qiE "tonic|tokio|rocksdb|redis|reqwest|macp-storage|macp-auth|macp-modes|macp-runtime"; then
            echo "::error::macp-core pulled a forbidden dependency"; exit 1
          fi

      - name: macp-modes has no concrete policy / transport
        run: |
          deps=$(cargo tree -p macp-modes --edges normal)
          echo "$deps"
          if echo "$deps" | sed 's/ ([^)]*)//' | grep -qiE "tonic|macp-policy|macp-storage|macp-auth|macp-runtime|reqwest|rocksdb|redis"; then
            echo "::error::macp-modes pulled a forbidden dependency"; exit 1
          fi

      # Decision receipts (RFC-MACP-0013 §13) are behind macp-core's
      # non-default `receipts` feature: the embeddable vocabulary crates carry
      # no signature crates unless an embedder asks for them.
      - name: receipt signing stays out of the default vocabulary crates
        run: |
          for crate in macp-core macp-modes macp-policy; do
            deps=$(cargo tree -p "$crate" --edges normal)
            if echo "$deps" | sed 's/ ([^)]*)//' | grep -qiE "ed25519|pkcs8"; then
              echo "::error::$crate pulled receipt-signing crates by default"; exit 1
            fi
          done

      # The conformance library's in-process path must carry no transport.
      # tonic (the `grpc` feature) and hyper/tokio-rustls (the `http`
      # feature) are checked: tokio already arrives through macp-modes and
      # macp-policy (tokio::sync::broadcast), so "no tokio" cannot hold here.
      - name: macp-conform without grpc has no transport
        run: |
          deps=$(cargo tree -p macp-conform --edges normal)
          echo "$deps"
          if echo "$deps" | sed 's/ ([^)]*)//' | grep -qiE "tonic|hyper|tokio-rustls|macp-storage|macp-auth|macp-runtime|reqwest|rocksdb|redis"; then
            echo "::error::macp-conform (default features) pulled a forbidden dependency"; exit 1
          fi

      - name: auth deps stay out of the vocabulary crates
        run: |
          for crate in macp-core macp-modes macp-policy macp-storage; do
            deps=$(cargo tree -p "$crate" --edges normal)
            if echo "$deps" | sed 's/ ([^)]*)//' | grep -qiE "jsonwebtoken|reqwest"; then
              echo "::error::$crate pulled an auth-only dependency"; exit 1
            fi
          done

      # The HTTP/JSON listener (`http-listener`, plans/http-listener.md P3) is
      # opt-in and root-crate only. The Seam crates never see its codec or
      # TLS/HTTP stack, whatever their features; the root crate's default
      # build has no prost-reflect at all and none of the feature's seven
      # optional deps as a direct dependency. (hyper, hyper-util and
      # tokio-rustls are already transitive through tonic's transport, so the
      # default-build check is on direct edges, depth 1.)
      - name: http-listener deps stay opt-in and out of the Seam crates
        # Every match reads a captured variable through a here-string, never
        # `echo | grep -q`: under pipefail, grep -q exiting on the first match
        # SIGPIPEs the writer (status 141), which `if` would read as "no match"
        # and pass a real leak.
        run: |
          set -euo pipefail
          # ctree ARGS...: the cargo tree output with "(*)"/"(proc-macro)" notes stripped,
          # uncoloured (CI sets CARGO_TERM_COLOR=always, and the escape codes
          # around the tree glyphs would defeat the anchored patterns below).
          ctree() { local out; out=$(cargo tree --color never "$@") || return 1; printf '%s\n' "$out" | sed 's/ ([^)]*)//'; }
          for crate in macp-core macp-modes macp-pb macp-policy; do
            deps=$(ctree -p "$crate" --edges normal --all-features)
            if grep -qE "(prost-reflect|hyper-util|tokio-rustls) v" <<<"$deps"; then
              echo "::error::$crate pulled an http-listener dependency"; exit 1
            fi
          done
          deps=$(ctree -p macp-runtime --edges normal)
          if grep -qE "prost-reflect v" <<<"$deps"; then
            echo "::error::macp-runtime's default build pulled prost-reflect"; exit 1
          fi
          direct=$(ctree -p macp-runtime --edges normal --depth 1)
          echo "$direct"
          if grep -qE "^[├└]── (prost-reflect|hyper|hyper-util|http-body-util|tokio-rustls|http|bytes) v" <<<"$direct"; then
            echo "::error::macp-runtime's default build has a direct http-listener dependency"; exit 1
          fi
          # ...and the feature does turn them on (the check above is not vacuous).
          on=$(ctree -p macp-runtime --edges normal --depth 1 --features http-listener)
          for dep in prost-reflect hyper hyper-util http-body-util tokio-rustls http bytes; do
            if ! grep -qE "^[├└]── $dep v" <<<"$on"; then
              echo "::error::http-listener no longer enables $dep"; exit 1
            fi
          done

      # Every workspace crate must publish at one lockstep version. Package
      # versions are structurally pinned via `version.workspace = true`, but the
      # `version` literals in `[workspace.dependencies]` for the internal crates
      # are hand-maintained and can drift on a bump. A `0.6.0` crate that still
      # requires `^0.5.0` of a sibling won't resolve at publish time (0.x minors
      # are breaking) — catch that here instead of mid-release.
      - name: Internal crate versions are in lockstep
        run: |
          set -euo pipefail
          meta=$(cargo metadata --format-version 1 --no-deps)
          ws=$(echo "$meta" | jq -r '.packages[] | select(.name=="macp-runtime") | .version')
          echo "workspace version = $ws"
          fail=0

          # 1) Every member's package version matches the workspace version.
          while read -r name ver; do
            if [ "$ver" != "$ws" ]; then
              echo "::error::$name package version $ver != workspace $ws"; fail=1
            fi
          done < <(echo "$meta" | jq -r '.packages[] | "\(.name) \(.version)"')

          # 2) Every internal dependency requirement is exactly ^<workspace ver>.
          while read -r from to req; do
            if [ "$req" != "^$ws" ]; then
              echo "::error::$from depends on $to with req '$req', expected '^$ws'"; fail=1
            fi
          done < <(echo "$meta" | jq -r '
            (.packages | map(.name)) as $members
            | .packages[] | . as $p
            | $p.dependencies[]
            | select([.name] | inside($members))
            | "\($p.name) \(.name) \(.req)"')

          if [ "$fail" -ne 0 ]; then
            echo "::error::workspace crate versions are not in lockstep"; exit 1
          fi
          echo "All workspace crates and internal deps pinned at $ws"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Blocking: a RUSTSEC advisory fails the gate. The escape hatch for
    # advisories without an available fix is the ignore list in
    # .cargo/audit.toml (each entry documents its justification).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The action above reads ./Cargo.lock only. `integration_tests/` is a
      # separate crate outside the workspace with its own lockfile that
      # dependabot does not update, so it drifted unaudited until it had
      # accumulated five advisories including a high-severity one. Test-only
      # code, never published — but it runs in CI, and an unwatched lockfile
      # is how the drift went unnoticed rather than how it was harmless.
      # 0.22 is a floor, not a preference: 0.21 cannot parse a CVSS 4.0 score
      # and dies on the whole advisory database with "unsupported CVSS
      # version: 4.0" — a hard error unrelated to any advisory this repo has.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22

      - name: Run cargo audit (integration_tests lockfile)
        working-directory: integration_tests
        run: cargo audit --file Cargo.lock

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage
        # tarpaulin already instruments all targets by default and rejects a
        # second explicit --all-targets, so it is not passed here.
        run: cargo tarpaulin --workspace --out xml
        env:
          MACP_MEMORY_ONLY: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  features:
    name: Feature-gated code (rocksdb, redis, otel)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: features

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      # These backends were previously never compiled in CI — clippy had
      # never seen the code and a broken backend could not fail a build.
      - name: Clippy (feature-gated code)
        run: cargo clippy -p macp-storage --features rocksdb-backend,redis-backend --all-targets -- -D warnings

      - name: Clippy + test (macp-core receipts feature)
        run: |
          cargo clippy -p macp-core --features receipts --all-targets -- -D warnings
          cargo test -p macp-core --features receipts

      # The otel exporter feature on the root crate was never compiled in CI.
      - name: Clippy (otel feature)
        run: cargo clippy -p macp-runtime --features otel --all-targets -- -D warnings

      # ...and compiled but never tested; test it too (otel-spans P0).
      - name: Test otel feature
        run: cargo test -p macp-runtime --features otel

      # gRPC server reflection (dev/debug tooling, issue #187) -- opt-in,
      # non-default feature on the root crate.
      - name: Clippy (reflection feature)
        run: cargo clippy -p macp-runtime --features reflection --all-targets -- -D warnings

      - name: Test reflection feature (descriptor set + service build)
        run: cargo test -p macp-runtime --features reflection --test reflection

      # The HTTP/JSON listener and its canonical JSON codec
      # (plans/http-listener.md), opt-in and non-default on the root crate:
      # alone, and together with otel as the published image builds it.
      - name: Clippy (http-listener feature)
        run: |
          cargo clippy -p macp-runtime --features http-listener --all-targets -- -D warnings
          cargo clippy -p macp-runtime --features otel,http-listener --all-targets -- -D warnings

      - name: Test http-listener feature
        run: cargo test -p macp-runtime --features http-listener

      # The HTTP dispatch table is pinned to telemetry::grpc::METHODS by a
      # test that exists only with both features; the lib's http:: tests
      # are cheap (the filter also matches telemetry::http::), so run them all
      # under the combination, together with the HTTP SERVER span and
      # request-duration tests (tests/otel_http.rs, which needs both too).
      - name: Test http-listener with otel (dispatch table, HTTP telemetry)
        run: |
          cargo test -p macp-runtime --features otel,http-listener --lib http::
          cargo test -p macp-runtime --features otel,http-listener --test otel_http

      - name: Rustdoc (http-listener feature, deny warnings)
        run: cargo doc -p macp-runtime --no-deps --features http-listener
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Both backends enabled together must also build at the root crate —
      # feature unification across the workspace is not covered by the
      # per-feature runs below.
      - name: Check root crate with all storage backends
        run: cargo check -p macp-runtime --features rocksdb-backend,redis-backend --all-targets

      - name: Test rocksdb backend
        run: cargo test -p macp-storage --features rocksdb-backend

      - name: Test redis backend (live service)
        run: cargo test -p macp-storage --features redis-backend
        env:
          MACP_TEST_REDIS_URL: redis://127.0.0.1:6379

      - name: Test both backends enabled together
        run: cargo test -p macp-storage --features rocksdb-backend,redis-backend
        env:
          MACP_TEST_REDIS_URL: redis://127.0.0.1:6379

      # End-to-end: the runtime binary actually running on each backend
      # through the gRPC boundary (previously only the storage crate's own
      # unit tests covered these features).
      - name: Build runtime binary with storage backends
        run: cargo build --features rocksdb-backend,redis-backend

      - name: Backend smoke test through gRPC (rocksdb)
        working-directory: integration_tests
        run: cargo test --test tier1 configured_backend -- --test-threads=1
        env:
          MACP_TEST_BINARY: ../target/debug/macp-runtime
          MACP_TEST_BACKEND: rocksdb

      - name: Backend smoke test through gRPC (redis)
        working-directory: integration_tests
        run: cargo test --test tier1 configured_backend -- --test-threads=1
        env:
          MACP_TEST_BINARY: ../target/debug/macp-runtime
          MACP_TEST_BACKEND: redis
          MACP_TEST_REDIS_URL: redis://127.0.0.1:6379

  integration:
    name: Integration (tier 1 + 2, real gRPC boundary)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: integration
          workspaces: |
            .
            integration_tests

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      # Same guard as the root workspace's in the `check` job, for the second
      # lock: `integration_tests/` is its own workspace, so a stale lock (or
      # one pinning a version its manifest forbids, issue #140) would
      # otherwise reach `main` -- nothing else here passes --locked, and cargo
      # silently repairs a stale lock at build time.
      #
      # SCOPE, wider than it looks: `integration_tests/Cargo.lock` records the
      # full dependency edges of the seven path crates, so adding or removing a
      # dependency in ANY workspace crate -- `crates/macp-*/Cargo.toml` or the
      # root `Cargo.toml`, not just `integration_tests/Cargo.toml` -- reds this
      # job unless the lock is regenerated in the SAME PR. So does changing a
      # requirement the existing pin no longer satisfies; a requirement change
      # the pin still satisfies is fine (the two locks legitimately hold
      # different `serde 1.x` patch versions today). Regenerating is a no-op
      # when nothing moved, so just run it:
      #   cargo metadata --manifest-path integration_tests/Cargo.toml --format-version 1 > /dev/null
      #
      # Sited in this job rather than the MSRV `check` job because that job
      # pins toolchain 1.89.0 while this manifest declares no `rust-version`.
      # Runs before the build so a stale lock fails fast.
      - name: Verify integration_tests/Cargo.lock is consistent with its manifest
        run: cargo metadata --locked --manifest-path integration_tests/Cargo.toml --format-version 1 > /dev/null

      # The `macp` CLI too: test_decision_receipts runs `macp verify --keys-from`.
      - name: Build runtime and CLI binaries
        run: cargo build -p macp-runtime -p macp-cli --bins

      # Tier 2 (Rig ToolSet against the live server) is deterministic — no
      # LLM, no network beyond localhost — so it runs on every PR alongside
      # tier 1. Tier 3 (real OpenAI agents) stays behind the manual
      # integration-tests.yml dispatch.
      - name: Run tier-1 + tier-2 suites
        working-directory: integration_tests
        run: cargo test --test tier1 --test tier1_jwt --test tier2 -- --test-threads=1
        env:
          MACP_TEST_BINARY: ../target/debug/macp-runtime
        timeout-minutes: 15

  # Conformance oracle: the spec repo's schemas/conformance/ is the single
  # canonical fixture source; this repo vendors byte-identical copies under
  # tests/conformance/ for hermetic local runs. This job (a) byte-compares
  # the vendored copies against canonical and (b) re-runs the conformance
  # suite directly against the canonical files — spec and runtime cannot
  # drift silently (master plan §5.7 step 4, upstream issue #44).
  conformance-oracle:
    name: Conformance oracle (spec-repo fixtures)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout spec repo (canonical fixtures)
        uses: actions/checkout@v7
        with:
          repository: multiagentcoordinationprotocol/multiagentcoordinationprotocol
          ref: ${{ env.SPEC_REV }}
          path: spec-repo

      - name: Vendored fixtures are byte-identical to canonical
        run: |
          status=0
          # Drift is checked in BOTH directions. The canonical -> vendored loop
          # is the load-bearing one: iterating only the vendored side can never
          # reach a fixture that was added upstream and never vendored here, so
          # the runtime would silently stop covering the canonical set while
          # this job stayed green. Mirrors the SDKs' `verify-fixtures` targets.
          check_dir() {
            local vendored_dir="$1" canonical_dir="$2"
            if [ ! -d "$canonical_dir" ]; then
              echo "MISSING: canonical directory $canonical_dir does not exist" >&2
              status=1
              return
            fi
            # canonical -> vendored: upstream additions and content drift
            for f in "$canonical_dir"/*.json; do
              [ -e "$f" ] || continue
              b=$(basename "$f")
              if [ ! -f "$vendored_dir/$b" ]; then
                echo "MISSING: $canonical_dir/$b has no vendored copy at $vendored_dir/$b -- vendor it and reference it from the conformance suite" >&2
                status=1
              elif ! diff -u "$canonical_dir/$b" "$vendored_dir/$b"; then
                echo "DRIFT: $b differs from the canonical spec-repo copy ($canonical_dir)" >&2
                status=1
              fi
            done
            # vendored -> canonical: local files with no canonical source
            for f in "$vendored_dir"/*.json; do
              [ -e "$f" ] || continue
              b=$(basename "$f")
              if [ ! -f "$canonical_dir/$b" ]; then
                echo "EXTRA: $vendored_dir/$b has no canonical source at $canonical_dir/$b" >&2
                status=1
              fi
            done
          }
          # One vendored file whose canonical directory holds many unrelated
          # files (schemas/json/), so check_dir would report those as MISSING.
          # Same MISSING/DRIFT wording; EXTRA cannot arise for a single file.
          check_file() {
            local vendored="$1" canonical="$2"
            if [ ! -f "$canonical" ]; then
              echo "MISSING: canonical file $canonical does not exist" >&2
              status=1
            elif [ ! -f "$vendored" ]; then
              echo "MISSING: $canonical has no vendored copy at $vendored -- vendor it" >&2
              status=1
            elif ! diff -u "$canonical" "$vendored"; then
              echo "DRIFT: $vendored differs from the canonical spec-repo copy ($canonical)" >&2
              status=1
            fi
          }
          check_dir "tests/conformance" "spec-repo/schemas/conformance"
          check_dir "tests/conformance/cmt-hash" "spec-repo/schemas/conformance/cmt-hash"
          check_dir "tests/vectors/receipt" "spec-repo/schemas/conformance/receipt"
          check_dir "tests/parity" "spec-repo/schemas/parity"
          check_dir "tests/otel" "spec-repo/schemas/otel"
          check_dir "tests/http/examples" "spec-repo/examples/http"
          check_dir "tests/http/invalid-errors" "spec-repo/schemas/json/tests/invalid-http-errors"
          check_file "tests/http/macp-http-error.schema.json" "spec-repo/schemas/json/macp-http-error.schema.json"
          exit $status

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: main

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      - name: Run conformance suite against canonical fixtures
        env:
          MACP_CONFORMANCE_FIXTURES_DIR: ${{ github.workspace }}/spec-repo/schemas/conformance
        run: cargo test --test conformance_loader

      # tests/parity_contract.rs currently defines 18 #[test] functions; a
      # bare `cargo test` exit code can't tell a passing suite from a
      # silently-renamed-or-#[ignore]d one (it exits 0 either way), so this
      # asserts the reported passed-count directly, same idea as the
      # single-test guard below.
      - name: Run parity-contract suite against canonical manifest
        env:
          MACP_PARITY_CONTRACT: ${{ github.workspace }}/spec-repo/schemas/parity/contract.json
        run: |
          set -o pipefail
          log="${RUNNER_TEMP:-/tmp}/parity-contract.log"
          cargo test --test parity_contract | tee "$log"
          passed=$(grep -oE '^test result: ok\. [0-9]+ passed' "$log" | grep -oE '[0-9]+' | head -1)
          if [ -z "$passed" ] || [ "$passed" -lt 18 ]; then
            echo "::error::expected at least 18 parity_contract tests to pass, got '${passed:-0}' -- was a test renamed, skipped, or #[ignore]d?"
            exit 1
          fi

      # The policy registry's value-domain validators are hand-written mirrors
      # of schemas/json/policy/*.schema.json (this runtime carries no
      # JSON-Schema evaluator). This job is the only one with the spec repo
      # checked out, so it is where the mirrors are held to the canonical enums
      # and bounds. The test skips with a printed warning only when neither
      # MACP_POLICY_SCHEMAS_DIR nor a sibling spec checkout exists, which is
      # what keeps it green for contributors without one — it is deliberately
      # not `#[ignore]`d. Here the env var is set, so a missing directory
      # panics instead of skipping.
      #
      # Three tests read the canonical schemas: the enum/bound mirrors, the
      # closed key sets (RFC-MACP-0012 §4), and the spec's own
      # schemas/json/tests/{valid,invalid}-*-rules fixtures driven through
      # registration. All three skip without the spec checkout, so before
      # this step ran the last two they had never executed in CI.
      #
      # Each name is pinned with `--exact` and each run is asserted to have
      # executed exactly one test: libtest exits 0 when a filter matches
      # nothing, so a rename would otherwise silently retire the gate.
      - name: Policy validators match the canonical schemas
        env:
          MACP_POLICY_SCHEMAS_DIR: ${{ github.workspace }}/spec-repo/schemas/json/policy
        run: |
          set -o pipefail
          for TEST_NAME in \
            registry::tests::enum_lists_match_the_canonical_schemas \
            registry::tests::closed_key_sets_match_the_canonical_schemas \
            registry::tests::canonical_schema_fixtures_register_or_are_refused
          do
            log="${RUNNER_TEMP:-/tmp}/policy-parity-${TEST_NAME##*::}.log"
            cargo test -p macp-policy --lib -- --exact "$TEST_NAME" | tee "$log"
            grep -q '^test result: ok\. 1 passed' "$log" || {
              echo "::error::'$TEST_NAME' matched no test — was it renamed or moved?"
              exit 1
            }
          done

      # `macp_core::error::ERROR_CODE_REGISTRY` mirrors the spec's
      # registries/error-codes.md (HTTP column, and the S13 gRPC column once
      # SPEC_REV carries it). Same exact-name/one-test guard as above.
      - name: Error-code registry matches the canonical table
        env:
          MACP_ERROR_REGISTRY_PATH: ${{ github.workspace }}/spec-repo/registries/error-codes.md
          TEST_NAME: error::tests::registry_matches_the_spec_table
        run: |
          set -o pipefail
          log="${RUNNER_TEMP:-/tmp}/error-registry-parity.log"
          cargo test -p macp-core --lib -- --exact "$TEST_NAME" | tee "$log"
          grep -q '^test result: ok\. 1 passed' "$log" || {
            echo "::error::'$TEST_NAME' matched no test — was it renamed or moved?"
            exit 1
          }

  # The macp-conform CLI over gRPC: the Server-profile path end to end, with
  # the canonical fixtures at SPEC_REV. A server exposes no clock or
  # commitment-hash API. Per the spec's Server-profile rules
  # (docs/conformance.md, Profiles) the clocked fixture is skipped
  # (`needs-clock-control`) without counting against a level, and the
  # cmt-hash vectors count when they pass in-process against the same
  # implementation and release.
  #   1. The published image: the vectors are skipped (`needs-hash-api`), so
  #      Core stays `incomplete`; fails only on a fixture that fails/errors.
  #   2. A server built from this checkout, with `--hash-vectors in-process`
  #      (same release by construction) and `--strict`: must claim
  #      Standard modes + multi_round.
  #   3. The same, over the HTTP binding (`--transport http`, RFC-MACP-0006
  #      §4; plans/http-listener.md P10): the runtime built with
  #      `http-listener`, the CLI with `http`. Same claim. Local build only
  #      until a published image carries the feature (then add an image step).
  conform-cli:
    name: macp-conform CLI (GHCR image, gRPC)
    runs-on: ubuntu-latest
    env:
      MACP_CONFORM_IMAGE: ghcr.io/multiagentcoordinationprotocol/macp-runtime:0.9.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout spec repo (canonical fixtures)
        uses: actions/checkout@v7
        with:
          repository: multiagentcoordinationprotocol/multiagentcoordinationprotocol
          ref: ${{ env.SPEC_REV }}
          path: spec-repo

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: main

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      - name: Build macp-conform and the runtime
        run: |
          cargo build -p macp-conform --features grpc,http --bin macp-conform
          cargo build --bin macp-runtime --features http-listener

      - name: Run the HTTP curl examples of docs/examples.md
        # Every marked curl block in the "HTTP/JSON binding (curl)" section,
        # against the binary just built (plans/http-listener.md P11).
        run: scripts/check-http-examples.sh

      - name: Start the runtime image
        run: |
          docker run -d --name macp -p 50051:50051 \
            -e MACP_ALLOW_INSECURE=1 -e MACP_MEMORY_ONLY=1 \
            "$MACP_CONFORM_IMAGE"
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/50051) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs macp
          echo "::error::runtime image did not open port 50051"; exit 1

      - name: Run macp-conform over gRPC
        run: |
          ./target/debug/macp-conform \
            --target grpc://127.0.0.1:50051 \
            --fixtures spec-repo/schemas/conformance \
            --level standard --multi-round \
            --report macp-conform-report.json

      - name: Run macp-conform over gRPC, hash vectors in-process (this checkout)
        run: |
          MACP_ALLOW_INSECURE=1 MACP_MEMORY_ONLY=1 MACP_BIND_ADDR=127.0.0.1:50052 \
            ./target/debug/macp-runtime > macp-local.log 2>&1 &
          ready=
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/50052) 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          test -n "$ready" || { cat macp-local.log; echo "::error::local runtime did not open port 50052"; exit 1; }
          ./target/debug/macp-conform \
            --target grpc://127.0.0.1:50052 \
            --fixtures spec-repo/schemas/conformance \
            --level standard --multi-round --strict \
            --hash-vectors in-process \
            --report macp-conform-report-hash-in-process.json
          claim=$(jq -r .claim macp-conform-report-hash-in-process.json)
          echo "claim: $claim" >> "$GITHUB_STEP_SUMMARY"
          test "$claim" = "Standard modes + multi_round, Server profile (hash vectors in-process)" || {
            echo "::error::unexpected claim: $claim"; exit 1
          }

      - name: Run macp-conform over HTTP, hash vectors in-process (this checkout)
        run: |
          # gRPC on 50053 (unused here), HTTP on 8080. Readiness is the HTTP
          # port answering a real RPC (GetManifest, unauthenticated), polled
          # with a deadline instead of a fixed sleep.
          MACP_ALLOW_INSECURE=1 MACP_MEMORY_ONLY=1 MACP_BIND_ADDR=127.0.0.1:50053 \
            MACP_HTTP_BIND_ADDR=127.0.0.1:8080 \
            ./target/debug/macp-runtime > macp-local-http.log 2>&1 &
          ready=
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 -o /dev/null -X POST -H 'Content-Type: application/json' -d '{}' \
                 http://127.0.0.1:8080/macp/v1/GetManifest; then ready=1; break; fi
            sleep 1
          done
          test -n "$ready" || { cat macp-local-http.log; echo "::error::HTTP listener did not answer on 8080"; exit 1; }
          ./target/debug/macp-conform \
            --transport http \
            --target http://127.0.0.1:8080 \
            --fixtures spec-repo/schemas/conformance \
            --level standard --multi-round --strict \
            --hash-vectors in-process \
            --report macp-conform-report-http.json
          claim=$(jq -r .claim macp-conform-report-http.json)
          echo "claim (HTTP): $claim" >> "$GITHUB_STEP_SUMMARY"
          test "$claim" = "Standard modes + multi_round, Server profile (hash vectors in-process)" || {
            echo "::error::unexpected claim over HTTP: $claim"; exit 1
          }

      - name: Runtime logs
        if: failure()
        run: |
          docker logs macp
          cat macp-local.log || true
          cat macp-local-http.log || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macp-conform-report
          path: macp-conform-report*.json
          if-no-files-found: warn

  # Build-only Docker gate: proves the published image still builds without
  # pushing anything. The push happens in docker.yml on main/tags. Added after
  # the A-E merge broke the main image build while its (non-required) check
  # was red — this job is in ci-pass, so image breakage now blocks merges.
  docker-build:
    name: Docker Image Build (gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: macp-runtime:ci
          # Same features as the published image (docker.yml).
          build-args: |
            CARGO_FEATURES=otel,http-listener
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image without MACP_HTTP_* opens only the gRPC port
        # The image includes http-listener; with no MACP_HTTP_* set it must
        # behave as before: one listening socket (50051), no HTTP log line.
        run: |
          docker run -d --name plain -e MACP_ALLOW_INSECURE=1 -e MACP_MEMORY_ONLY=1 macp-runtime:ci
          listening() {
            # Local ports in LISTEN state (0A), from the container's netns.
            docker exec plain cat /proc/net/tcp /proc/net/tcp6 2>/dev/null \
              | awk '$4 == "0A" { split($2, a, ":"); print a[2] }' | sort -u
          }
          for _ in $(seq 1 60); do
            if listening | grep -qx C383; then break; fi
            sleep 1
          done
          ports=$(listening | tr '\n' ' ')
          echo "listening (hex): $ports"
          test "$ports" = "C383 " || { docker logs plain; echo "::error::expected only 50051 (C383), got: $ports"; exit 1; }
          if docker logs plain 2>&1 | grep -q 'HTTP listener'; then
            docker logs plain; echo "::error::HTTP listener started without MACP_HTTP_BIND_ADDR"; exit 1
          fi

      - name: Image with MACP_HTTP_BIND_ADDR answers GetManifest over HTTP
        run: |
          docker run -d --name http -p 8080:8080 \
            -e MACP_ALLOW_INSECURE=1 -e MACP_MEMORY_ONLY=1 -e MACP_HTTP_BIND_ADDR=0.0.0.0:8080 \
            macp-runtime:ci
          code=
          for _ in $(seq 1 60); do
            code=$(curl -sS --max-time 5 -o manifest.json -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d '{}' \
              http://127.0.0.1:8080/macp/v1/GetManifest || true)
            if [ "$code" = 200 ]; then break; fi
            sleep 1
          done
          test "$code" = 200 || { docker logs http; echo "::error::GetManifest over HTTP answered '$code', expected 200"; exit 1; }
          jq -e '.manifest' manifest.json > /dev/null

      - name: Container logs
        if: failure()
        run: |
          docker logs plain || true
          docker logs http || true

  ci-pass:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [check, fmt, clippy, docs, test, build, deps-isolation, audit, features, integration, docker-build, conformance-oracle, conform-cli]

    steps:
      - name: Summary
        run: |
          echo "All checks passed successfully"
          echo "  - cargo check (MSRV 1.89.0)"
          echo "  - cargo fmt"
          echo "  - cargo clippy"
          echo "  - cargo doc (deny warnings)"
          echo "  - cargo test"
          echo "  - cargo build --release"
          echo "  - crate dependency isolation"
          echo "  - security audit (blocking)"
          echo "  - feature-gated code (rocksdb, redis, otel)"
          echo "  - tier-1 + tier-2 integration suites"
          echo "  - docker image build (+ HTTP listener off/on smoke)"
          echo "  - macp-conform CLI against the published image (+ HTTP curl examples)"
