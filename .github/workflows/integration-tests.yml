name: Integration Tests

# Manual dispatch for the full integration matrix. Tier 1 + 2 also run on
# every PR via the `integration` job in ci.yml; this workflow exists to run
# them on demand and to opt into Tier 3 (real OpenAI agents).
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run Tier 3 E2E tests (OPENAI_API_KEY from Doppler macp-runtime/ci)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.96.1"
  PROTOC_VERSION: "31.x"

jobs:
  integration:
    name: Tier 1+2 Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: integration
          workspaces: |
            .
            integration_tests

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      # The `macp` CLI too: test_decision_receipts runs `macp verify --keys-from`.
      - name: Build runtime and CLI binaries
        run: cargo build -p macp-runtime -p macp-cli --bins

      - name: Run Tier 1+2 integration tests
        working-directory: integration_tests
        env:
          MACP_TEST_BINARY: ../target/debug/macp-runtime
        run: cargo test -- --test-threads=1
        timeout-minutes: 10

  e2e:
    name: Tier 3 E2E Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.run_e2e == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: integration
          workspaces: |
            .
            integration_tests

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}

      - name: Build runtime binary
        run: cargo build

      # OPENAI_API_KEY comes from Doppler macp-runtime/ci via the read-only service
      # token in the DOPPLER_TOKEN repo secret. The tests skip when the key is unset,
      # so an empty key fails here instead of turning Tier 3 into a silent green.
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Run Tier 3 E2E tests
        working-directory: integration_tests
        env:
          MACP_TEST_BINARY: ../target/debug/macp-runtime
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          test -n "$DOPPLER_TOKEN" || { echo "::error::DOPPLER_TOKEN repo secret is not set"; exit 1; }
          doppler secrets get OPENAI_API_KEY --plain >/dev/null || { echo "::error::OPENAI_API_KEY is missing from Doppler macp-runtime/ci"; exit 1; }
          doppler run -- sh -c 'test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY is empty in Doppler macp-runtime/ci"; exit 1; }; exec cargo test -- --ignored --test-threads=1'
        timeout-minutes: 10
